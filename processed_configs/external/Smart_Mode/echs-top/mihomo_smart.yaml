# Processed: raw_configs/external/Smart_Mode/echs-top/mihomo_smart.yaml
# Providers: 3 proxy, 8 rule

rules:
- DST-PORT,5228-5230,直接连接
- SUB-RULE,(RULE-SET,telegram_ip,no-resolve),sub-telegram
- RULE-SET,ads,REJECT
- SUB-RULE,(RULE-SET,ai),sub-ai
- RULE-SET,proxy@direct,直接连接
- SUB-RULE,(RULE-SET,proxy-lite),sub-proxy
- RULE-SET,direct-lite,直接连接
- RULE-SET,direct_ip,直接连接
- AND,((NETWORK,udp),(DST-PORT,443)),代理QUIC
- MATCH,代理连接
rule-providers:
  ads:
    type: http
    interval: 86400
    proxy: 代理连接
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/echs-top/proxy/main/mrs/domain/ads.mrs
    path: ./rules/ads.mrs
  ai:
    type: http
    interval: 86400
    proxy: 代理连接
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/echs-top/proxy/main/mrs/domain/ai.mrs
    path: ./rules/ai.mrs
  proxy@direct:
    type: http
    interval: 86400
    proxy: 代理连接
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/echs-top/proxy/main/mrs/domain/proxy@direct.mrs
    path: ./rules/proxy@direct.mrs
  proxy-lite:
    type: http
    interval: 86400
    proxy: 代理连接
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/echs-top/proxy/main/mrs/domain/proxy-lite.mrs
    path: ./rules/proxy-lite.mrs
  direct-lite:
    type: http
    interval: 86400
    proxy: 代理连接
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/echs-top/proxy/main/mrs/domain/direct-lite.mrs
    path: ./rules/direct-lite.mrs
  dnsmasq-china-lite:
    type: http
    interval: 86400
    proxy: 代理连接
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/echs-top/proxy/main/mrs/domain/dnsmasq-china-lite.mrs
    path: ./rules/dnsmasq-china-lite.mrs
  telegram_ip:
    type: http
    interval: 86400
    proxy: 代理连接
    behavior: ipcidr
    format: mrs
    url: https://raw.githubusercontent.com/echs-top/proxy/main/mrs/ip/telegram.mrs
    path: ./rules/telegram_ip.mrs
  direct_ip:
    type: http
    interval: 86400
    proxy: 代理连接
    behavior: ipcidr
    format: mrs
    url: https://raw.githubusercontent.com/echs-top/proxy/main/mrs/ip/direct.mrs
    path: ./rules/direct_ip.mrs
proxy-providers:
  link1:
    type: http
    interval: 86400
    proxy: 直接连接
    header: &id001
      User-Agent:
      - clash-verge/v2.5.1
    health-check: &id002
      enable: true
      url: https://dns.google/generate_204
      expected-status: 204
      interval: 900
      timeout: 3000
      max-failed-times: 2
      lazy: true
    override: &id003
      ip-version: dual
    exclude-filter: (?i)套餐|剩余|流量|到期|重置|频道|订阅|官网|禁止|客户端|有效|联系|测试|节点|日期|群组|加入|通知|维护|网址|地址|下载|更新|APP|登录|严禁|恢复|处理|谢谢
    url: 订阅链接1
    path: ./providers/link1.yaml
  link2:
    type: http
    interval: 86400
    proxy: 直接连接
    header: *id001
    health-check: *id002
    override: *id003
    exclude-filter: (?i)套餐|剩余|流量|到期|重置|频道|订阅|官网|禁止|客户端|有效|联系|测试|节点|日期|群组|加入|通知|维护|网址|地址|下载|更新|APP|登录|严禁|恢复|处理|谢谢
    url: 订阅链接2
    path: ./providers/link2.yaml
  link3:
    type: http
    interval: 86400
    proxy: 直接连接
    header: *id001
    health-check: *id002
    override: *id003
    exclude-filter: (?i)套餐|剩余|流量|到期|重置|频道|订阅|官网|禁止|客户端|有效|联系|测试|节点|日期|群组|加入|通知|维护|网址|地址|下载|更新|APP|登录|严禁|恢复|处理|谢谢
    url: 订阅链接3
    path: ./providers/link3.yaml
proxy-groups:
- name: 代理连接
  type: select
  proxies:
  - 最低延迟
  - 香港|智能选择
  - 台湾|智能选择
  - 新加坡|智能选择
  - 日本|智能选择
  - 韩国|智能选择
  - 美国|智能选择
  - 加拿大|智能选择
  - 德国|智能选择
  - 英国|智能选择
  - 法国|智能选择
  - 荷兰|智能选择
  include-all-providers: true
  icon: https://mihomo.echs.top/img/icon/Global.webp
- name: 直接连接
  type: select
  proxies:
  - DIRECT
  - IPV4优先
  - IPV6优先
  - 仅IPV4
  - 仅IPV6
  icon: https://mihomo.echs.top/img/icon/DIRECT.webp
- type: select
  proxies: &id004
  - 代理连接
  - 直接连接
  - 最低延迟
  - 香港|智能选择
  - 台湾|智能选择
