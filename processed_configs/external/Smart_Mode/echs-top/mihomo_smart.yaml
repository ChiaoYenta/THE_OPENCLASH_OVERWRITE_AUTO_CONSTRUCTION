    path: ./providers/link3.yaml
  link4:
    type: http
    interval: 86400
    proxy: 直接连接
    header: *id001
    health-check: *id002
    override: *id003
    exclude-filter: (?i)套餐|剩余|流量|到期|重置|频道|订阅|官网|禁止|客户端|有效|联系|测试|节点|日期|群组|加入|通知|维护|网址|地址|下载|更新|APP|登录|严禁|恢复|处理|谢谢
