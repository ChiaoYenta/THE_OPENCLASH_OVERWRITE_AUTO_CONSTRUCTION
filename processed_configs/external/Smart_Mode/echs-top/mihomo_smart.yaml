  - 日本|智能选择
  - 韩国|智能选择
  - 美国|智能选择
  - 加拿大|智能选择
  - 德国|智能选择
  - 英国|智能选择
  - 法国|智能选择
  - 荷兰|智能选择
  include-all-providers: true
  name: 代理DNS
  icon: https://mihomo.echs.top/img/icon/Server.webp
- name: 代理QUIC
  type: select
  proxies:
  - PASS-RULE
  - REJECT
  icon: https://mihomo.echs.top/img/icon/Settings.webp
- type: select
  proxies: *id004
  include-all-providers: true
  name: 国外AI
  icon: https://mihomo.echs.top/img/icon/AI.webp
- type: select
  proxies: *id004
  include-all-providers: true
  name: TELEGRAM
  icon: https://mihomo.echs.top/img/icon/Telegram.webp
- use: &id005
  - link1
  - link2
  name: 最低延迟
  type: url-test
  tolerance: 30
  empty-fallback: REJECT
  hidden: true
  icon: https://mihomo.echs.top/img/icon/Fast.webp
- use: *id005
  type: smart
  strategy: sticky-sessions
  uselightgbm: true
