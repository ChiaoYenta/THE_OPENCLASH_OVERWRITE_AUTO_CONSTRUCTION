proxy-providers:
  link1:
    type: http
    interval: 86400
    proxy: 直接连接
    header: &id001
      User-Agent:
      - clash-verge/v2.5.1
    health-check: &id002
      enable: true
      url: https://dns.google/generate_204
      expected-status: 204
      interval: 600
      timeout: 3000
      max-failed-times: 2
      lazy: false
    override: &id003
      ip-version: dual
    exclude-filter: (?i)套餐|剩余|流量|到期|重置|频道|订阅|官网|禁止|客户端|有效|联系|测试|节点|日期|群组|加入|通知|维护|网址|地址|下载|更新|APP|登录|严禁|恢复|处理|谢谢
    url: 订阅链接1
    path: ./providers/link1.yaml
  link2:
    type: http
    interval: 86400
    proxy: 直接连接
    header: *id001
    health-check: *id002
    override: *id003
