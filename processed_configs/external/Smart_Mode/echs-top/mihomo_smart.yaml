proxy-providers:
  link1:
    type: http
    interval: 86400
    proxy: 直接连接
    header: &id003
      User-Agent:
      - clash-verge/v2.4.7
    health-check: &id004
      enable: true
      url: https://dns.google/generate_204
      expected-status: 204
      interval: 900
      timeout: 3000
      max-failed-times: 2
      lazy: false
    override: &id005
      ip-version: dual
    exclude-filter: (?i)套餐|剩余|流量|到期|重置|频道|订阅|官网|禁止|客户端|有效|联系|测试|节点|日期|群组|加入|通知|维护|网址|地址|下载|更新|APP|登录|严禁|海外|恢复|处理|谢谢
