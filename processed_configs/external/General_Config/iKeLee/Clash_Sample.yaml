- name: 兜底后备策略
  type: fallback
  proxies:
  - 香港自动策略
  - 台湾自动策略
  - 日本自动策略
  - 韩国自动策略
  - 新国自动策略
  - 美国自动策略
  - 英国自动策略
  - 法国自动策略
  - 德国自动策略
- type: url-test
  interval: 6
  tolerance: 20
  lazy: true
  url: http://www.google.com/blank.html
  disable-udp: false
  timeout: 2000
  max-failed-times: 3
  hidden: true
  include-all-providers: true
  name: 香港自动策略
  filter: ^(?=.*((?i)🇭🇰|香港|(\b(HK|HKG|Hong)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$
