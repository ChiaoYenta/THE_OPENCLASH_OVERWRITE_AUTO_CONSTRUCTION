# Processed: raw_configs/external/General_Config/iKeLee/backup.yaml
# Providers: 2 proxy, 23 rule

proxy-providers:
  机场名称1:
    type: http
    interval: 3600
    health-check: &id001
      enable: true
      url: http://www.google.com/blank.html
      interval: 6
    url: 机场1的订阅URL
    path: ./proxy_providers/机场名称1.yaml
    override:
      additional-prefix: '[机场名称1] '
  机场名称2:
    type: http
    interval: 3600
    health-check: *id001
    url: 机场2的订阅URL
    path: ./proxy_providers/机场名称2.yaml
    override:
      additional-prefix: '[机场名称2] '
proxy-groups:
- name: 游戏选择
  type: select
  include-all-providers: true
  filter: ^(?=.*((?i)游戏|🎮|(\b(GAME)(\d+)?\b)))(?!.*((?i)回国|校园)).*$
  proxies:
  - DIRECT
  - 全球选择
- name: 全球选择
  type: select
  include-all-providers: true
