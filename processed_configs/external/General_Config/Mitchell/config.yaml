  - AI_稳定节点
  - AI_自动优选
  icon: https://github.com/DustinWin/ruleset_geodata/releases/download/icons/ai.png
- use: &id001
  - 2.p2
  - 3.p3
  - 4.p4
  name: AI_稳定节点
  type: fallback
  url: https://cp.cloudflare.com/generate_204
  interval: 7200
  max-failed-times: 1
  tolerance: 100
  lazy: true
  filter: p2 »🇺🇸 美国-03|p2 »🇸🇬 狮城-03|p2 »🇺🇸 美国-01
  icon: https://testingcf.jsdelivr.net/gh/aihdde/Rules@master/icon/ai.png
- use: *id001
  name: AI_自动优选
  type: url-test
  url: https://cp.cloudflare.com/generate_204
  interval: 3600
  tolerance: 50
  lazy: false
  filter: (?i)(🇺🇸|美国|美國|US|united\s?states|america|usa|洛杉矶|达拉斯|New\s?York|西雅图|🇸🇬|新加坡|狮城|SG|Singapore)
  icon: https://raw.githubusercontent.com/Mithcell-Ma/icon/refs/heads/main/ai_backup.png
- use: *id001
  type: load-balance
  lazy: true
  interval: 600
  strategy: round-robin
  max-failed-times: 3
  name: 香港均衡加速
  filter: (?i)(香港|hk|🇭🇰|hong\s?kong)
  icon: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/release/icon/color/available.png
- use: *id001
