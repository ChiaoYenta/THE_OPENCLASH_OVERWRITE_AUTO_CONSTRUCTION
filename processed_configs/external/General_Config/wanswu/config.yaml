# Processed: raw_configs/external/General_Config/wanswu/config.yaml
# Providers: 2 proxy, 30 rule

rules:
- RULE-SET,Direct,DIRECT
- AND,((DST-PORT,443),(NETWORK,UDP),(NOT,((RULE-SET,ChinaIP))),(NOT,((RULE-SET,China)))),REJECT
- RULE-SET,ChinaAPP,DIRECT
- RULE-SET,category-ads-all,REJECT
- RULE-SET,YouTube,YouTube
- RULE-SET,Github,Github
- RULE-SET,OpenAI,OpenAI
- RULE-SET,Gemini,Gemini
- RULE-SET,Google,Google
- RULE-SET,Apple,Apple
- RULE-SET,Claude,Claude
- RULE-SET,Twitter,Twitter(X)
- RULE-SET,Telegram,Telegram
- RULE-SET,Spotify,Spotify
- RULE-SET,TikTok,TikTok
- RULE-SET,WhatsApp,WhatsApp
- RULE-SET,OneDrive,OneDrive
- RULE-SET,Microsoft,Microsoft
- RULE-SET,Netflix,Netflix
- RULE-SET,Disney,Disney
- RULE-SET,Steam,Steam
- RULE-SET,Emby,Emby
- RULE-SET,Lan,DIRECT
- RULE-SET,China,DIRECT
- RULE-SET,LanIP,DIRECT,no-resolve
- RULE-SET,ChinaIP,DIRECT,no-resolve
- RULE-SET,GoogleIP,Google,no-resolve
- RULE-SET,TelegramIP,Telegram,no-resolve
- RULE-SET,TwitterIP,Twitter(X),no-resolve
- MATCH,手动选择
proxy-providers:
  main:
    exclude-filter: Expire|到期|剩余|Traffic|网址|官网|过期|地址
    type: http
    proxy: DIRECT
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    url: https://anyland.club/#/register?code=R7vdKxbE
    path: ./proxy_provider/main.yaml
    header:
      User-Agent:
      - Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)
      token:
      - '*********'
    override:
      udp: true
      additional-prefix: 主-
  back:
    exclude-filter: Expire|到期|剩余|Traffic|网址|官网|过期|地址
    type: file
    proxy: DIRECT
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    path: proxy_provider/back.yaml
    override:
      udp: true
      additional-prefix: 备-6-
