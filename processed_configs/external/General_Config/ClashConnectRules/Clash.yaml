# Processed: raw_configs/external/General_Config/ClashConnectRules/Clash.yaml
# Providers: 1 proxy, 66 rule

proxy-providers:
  all-proxies:
    type: http
    url: https://example.com/your-subscription-url
    interval: 3600
    path: ./providers/all-proxies.yaml
    health-check:
      enable: true
      interval: 600
      url: http://www.gstatic.com/generate_204
proxy-groups:
- name: 🚀 节点选择
  type: select
  proxies:
  - DIRECT
  - ♻️ 自动选择
  - 🚀 手动切换
  - 🇭🇰 Hong Kong
  - 🇯🇵 Japan
  - 🇺🇸 United States
  - 🇸🇬 Singapore
  - 🇹🇼 Taiwan
  - 🇰🇷 Korea
  - 🇬🇧 United Kingdom
  - 🇩🇪 Germany
  - 🇫🇷 France
  - 🌍 Other Regions
- name: 🚀 手动切换
  type: select
  proxies:
  - DIRECT
  use:
  - all-proxies
- name: ♻️ 自动选择
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  use:
  - all-proxies
- name: 🇭🇰 Hong Kong
  type: select
  use:
  - all-proxies
  filter: (?i)港|HK|Hong Kong
- name: 🇯🇵 Japan
  type: select
  use:
  - all-proxies
  filter: (?i)日|JP|Japan
- name: 🇺🇸 United States
  type: select
  use:
  - all-proxies
  filter: (?i)美|US|United States
- name: 🇸🇬 Singapore
  type: select
  use:
  - all-proxies
  filter: (?i)新|SG|Singapore
- name: 🇹🇼 Taiwan
  type: select
  use:
  - all-proxies
  filter: (?i)台|TW|Taiwan
- name: 🇰🇷 Korea
  type: select
  use:
  - all-proxies
  filter: (?i)韩|KR|Korea
- name: 🇬🇧 United Kingdom
  type: select
  use:
  - all-proxies
  filter: (?i)英|UK|United Kingdom
- name: 🇩🇪 Germany
  type: select
  use:
  - all-proxies
  filter: (?i)德|DE|Germany
- name: 🇫🇷 France
  type: select
  use:
  - all-proxies
  filter: (?i)法|FR|France
- name: 🌍 Other Regions
  type: select
  use:
  - all-proxies
  filter: ^(?!.*((?i)港|HK|Hong Kong|日|JP|Japan|美|US|United States|Balance|新|SG|Singapore|台|TW|Taiwan|韩|KR|Korea|英|UK|United
    Kingdom|德|DE|Germany|法|FR|France)).*$
