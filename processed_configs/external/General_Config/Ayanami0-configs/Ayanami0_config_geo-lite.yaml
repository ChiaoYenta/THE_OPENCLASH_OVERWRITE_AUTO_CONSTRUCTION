# Processed: raw_configs/external/General_Config/Ayanami0-configs/Ayanami0_config_geo-lite.yaml
# Providers: 4 proxy, 0 rule

proxy-groups:
- name: PROXY
  icon: https://cdn.jsdelivr.net/gh/GitMetaio/Surfing@rm/Home/icon/All.svg
  type: select
  proxies:
  - DIRECT
  include-all: true
proxy-providers:
  α:
    type: http
    interval: 86400
    health-check: &id001
      enable: true
      url: https://cp.cloudflare.com
      interval: 300
    proxy: DIRECT
    override:
      additional-prefix: α-
    path: ./proxies/α.yaml
    url: null
  β:
    type: http
    interval: 86400
    health-check: *id001
    proxy: DIRECT
    override:
      additional-prefix: β-
    path: ./proxies/β.yaml
    url: null
  γ:
    type: http
    interval: 86400
    health-check: *id001
    proxy: DIRECT
    override:
      additional-prefix: γ-
    path: ./proxies/γ.yaml
    url: null
  δ:
    type: http
    interval: 86400
    health-check: *id001
    proxy: DIRECT
    override:
      additional-prefix: δ-
    path: ./proxies/δ.yaml
    url: null
rules:
- GEOSITE,googlefcm,DIRECT
- GEOSITE,category-ads-all,REJECT
- GEOSITE,cn,DIRECT
- GEOSITE,private,DIRECT
- GEOSITE,category-games,DIRECT
- GEOSITE,microsoft@cn,DIRECT
- GEOSITE,geolocation-!cn,PROXY
- GEOIP,telegram,PROXY
- GEOIP,cn,DIRECT
- GEOIP,private,DIRECT,no-resolve
- MATCH,PROXY
